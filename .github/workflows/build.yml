name: build

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Fetch pinned source dependencies
        run: ./setup-deps.sh
      - name: Build OpenSSL for API 19
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: ./scripts/build-openssl.sh
      - name: Test, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK contract
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: ./scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AirPlay44-debug
          path: app/build/outputs/apk/debug/app-debug.apk
